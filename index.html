<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141815" />
    <meta name="description" content="FlowPilot brings customers, invoices, payments, expenses and cash flow together in one intelligent workspace." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        let saved = null;
        try { saved = localStorage.getItem('flowpilot-theme'); } catch { /* Use the system preference. */ }
        const valid = saved === 'light' || saved === 'dark';
        const theme = valid ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0d110e' : '#f3f0e8');
      })();
    </script>
    <title>FlowPilot — Everything your business needs to flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
